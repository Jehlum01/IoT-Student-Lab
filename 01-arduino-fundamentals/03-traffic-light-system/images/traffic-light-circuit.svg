<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f8fafc"/>

  <text x="600" y="55" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="32" font-weight="bold">
    Project 03 — Traffic Light System
  </text>

  <text x="600" y="90" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="18">
    Arduino Uno + Three LEDs + Current-Limiting Resistors
  </text>

  <!-- Arduino -->
  <rect x="70" y="180" width="330" height="360" rx="18"
        fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
  <text x="235" y="225" text-anchor="middle"
        font-family="Arial" font-size="28" font-weight="bold">
    Arduino UNO
  </text>

  <text x="120" y="300" font-family="Arial" font-size="22">D8</text>
  <text x="120" y="380" font-family="Arial" font-size="22">D9</text>
  <text x="120" y="460" font-family="Arial" font-size="22">D10</text>
  <text x="285" y="500" font-family="Arial" font-size="22">GND</text>

  <!-- Wires -->
  <line x1="160" y1="295" x2="500" y2="295" stroke="#111827" stroke-width="5"/>
  <line x1="160" y1="375" x2="500" y2="375" stroke="#111827" stroke-width="5"/>
  <line x1="160" y1="455" x2="500" y2="455" stroke="#111827" stroke-width="5"/>
  <line x1="350" y1="500" x2="850" y2="600" stroke="#111827" stroke-width="5"/>

  <!-- Resistors -->
  <rect x="500" y="275" width="100" height="40" rx="6"
        fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <rect x="500" y="355" width="100" height="40" rx="6"
        fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <rect x="500" y="435" width="100" height="40" rx="6"
        fill="#ffffff" stroke="#111827" stroke-width="3"/>

  <text x="550" y="302" text-anchor="middle" font-family="Arial" font-size="18">220 Ω</text>
  <text x="550" y="382" text-anchor="middle" font-family="Arial" font-size="18">220 Ω</text>
  <text x="550" y="462" text-anchor="middle" font-family="Arial" font-size="18">220 Ω</text>

  <!-- LEDs -->
  <circle cx="720" cy="295" r="42" fill="#ef4444" stroke="#111827" stroke-width="4"/>
  <circle cx="720" cy="375" r="42" fill="#facc15" stroke="#111827" stroke-width="4"/>
  <circle cx="720" cy="455" r="42" fill="#22c55e" stroke="#111827" stroke-width="4"/>

  <text x="805" y="303" font-family="Arial" font-size="24" font-weight="bold">RED</text>
  <text x="805" y="383" font-family="Arial" font-size="24" font-weight="bold">YELLOW</text>
  <text x="805" y="463" font-family="Arial" font-size="24" font-weight="bold">GREEN</text>

  <!-- Ground -->
  <line x1="850" y1="570" x2="850" y2="630" stroke="#111827" stroke-width="5"/>
  <line x1="810" y1="630" x2="890" y2="630" stroke="#111827" stroke-width="5"/>
  <line x1="820" y1="645" x2="880" y2="645" stroke="#111827" stroke-width="5"/>
  <line x1="835" y1="660" x2="865" y2="660" stroke="#111827" stroke-width="5"/>
  <text x="910" y="635" font-family="Arial" font-size="22">GND</text>

  <!-- Labels -->
  <text x="600" y="650" text-anchor="middle"
        font-family="Arial" font-size="20">
    Each LED uses its own 220 Ω current-limiting resistor
  </text>
</svg>
